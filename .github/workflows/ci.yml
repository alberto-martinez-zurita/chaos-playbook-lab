name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1  # same version that generated poetry.lock
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check src/ tests/
        continue-on-error: true  # style only; src/ is frozen as used in the campaign

      - name: Dependency audit
        run: poetry run pip-audit --strict
        continue-on-error: true

      - name: Run unit tests with coverage
        run: |
          poetry run python -m pytest tests/unit/ -v \
            --cov=chaos_engine --cov-report=term-missing
        env:
          PYTHONPATH: src

      - name: Run integration tests
        run: |
          poetry run python -m pytest tests/integration/ -v
        env:
          PYTHONPATH: src
