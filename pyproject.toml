[tool.poetry]
name = "chaos-playbook-engine"
version = "2.1.0"
description = "A production-grade chaos engineering framework for AI agents"
authors = ["Alberto Martinez <albertomz@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/alberto-martinez-zurita/chaos-playbook-lab"
repository = "https://github.com/alberto-martinez-zurita/chaos-playbook-lab"
keywords = ["chaos-engineering", "ai-agents", "resilience", "testing", "playbooks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
]
packages = [{include = "chaos_engine", from = "src"}]

[tool.poetry.scripts]
chaos-engine = "chaos_engine.__main__:main"

[tool.poetry.dependencies]
python = "^3.11"
google-adk = {extras = ["eval"], version = "^1.19.0"}
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
matplotlib = "^3.10.7"
adjusttext = "^1.4.0"
seaborn = "^0.13.2"
numpy = "^2.3.5"
rich = "^14.2.0"
httpx = ">=0.24.0"
prometheus-client = "^0.24.1"
openai = ">=1.0.0"
tenacity = ">=8.0.0"
pyautogui = {version = "^0.9.54", optional = true}

[tool.poetry.extras]
gui = ["pyautogui"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
mypy = "^1.5.0"
black = "^23.9.0"
ruff = "^0.0.292"
isort = "^5.12.0"
ipython = "^8.15.0"
pytest-html = "^4.1.1"
coverage = "^7.12.0"
hypothesis = "^6.0.0"
pip-audit = "^2.0.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
